<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Collector — Options</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --accent:  #c9a84c;
      --text:    #e8e8e8;
      --muted:   #666;
      --success: #27ae60;
      --danger:  #c0392b;
      --radius:  6px;
    }

    body {
      background:  var(--bg);
      color:       var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size:   14px;
      padding:     0;
      min-height:  100vh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width:  560px;
      margin:     0 auto;
      padding:    40px 24px 60px;
    }

    /* ── Header ── */
    header {
      display:        flex;
      align-items:    center;
      gap:            10px;
      margin-bottom:  32px;
      padding-bottom: 20px;
      border-bottom:  1px solid var(--border);
    }

    .logo-mark {
      font-family:    'DM Mono', monospace;
      font-size:      11px;
      font-weight:    500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color:          var(--accent);
    }

    .header-sub {
      font-size: 12px;
      color:     var(--muted);
      margin-top: 2px;
    }

    /* ── Section ── */
    .section {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      padding:       20px 24px;
      margin-bottom: 16px;
    }

    .section-label {
      font-family:    'DM Mono', monospace;
      font-size:      10px;
      font-weight:    500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color:          var(--accent);
      margin-bottom:  16px;
      display:        flex;
      align-items:    center;
      gap:            7px;
    }

    .section-label::before {
      content:       '';
      width:         2px;
      height:        10px;
      background:    var(--accent);
      border-radius: 1px;
    }

    /* ── Field ── */
    .field {
      margin-bottom: 16px;
    }

    .field:last-child { margin-bottom: 0; }

    .field-label {
      font-size:     12px;
      font-weight:   500;
      color:         var(--text);
      margin-bottom: 6px;
      display:       block;
    }

    .field-sub {
      font-size:    11px;
      color:        var(--muted);
      margin-bottom: 8px;
      line-height:  1.4;
    }

    .field-row {
      display:     flex;
      align-items: center;
      gap:         10px;
    }

    input[type="number"],
    input[type="password"],
    input[type="text"] {
      background:    var(--bg);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      padding:       9px 12px;
      font-family:   'DM Mono', monospace;
      font-size:     12px;
      color:         var(--text);
      outline:       none;
      transition:    border-color 0.15s;
    }

    input[type="number"] { width: 100px; text-align: center; }
    input[type="password"],
    input[type="text"]   { flex: 1; }

    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }

    /* ── Status pill ── */
    .status-pill {
      display:        inline-flex;
      align-items:    center;
      gap:            6px;
      font-family:    'DM Mono', monospace;
      font-size:      11px;
      padding:        5px 10px;
      border-radius:  var(--radius);
      border:         1px solid var(--border);
      color:          var(--muted);
      background:     var(--bg);
      white-space:    nowrap;
      transition:     all 0.25s;
    }

    .status-pill::before {
      content:       '';
      width:         6px;
      height:        6px;
      border-radius: 50%;
      background:    currentColor;
      flex-shrink:   0;
    }

    .status-pill.running {
      color:        var(--success);
      border-color: rgba(39, 174, 96, 0.3);
      background:   rgba(39, 174, 96, 0.06);
    }

    .status-pill.stopped {
      color:        var(--danger);
      border-color: rgba(192, 57, 43, 0.3);
      background:   rgba(192, 57, 43, 0.06);
    }

    /* ── Buttons ── */
    .btn {
      border-radius: var(--radius);
      font-family:   'DM Sans', sans-serif;
      font-size:     13px;
      font-weight:   500;
      padding:       9px 18px;
      cursor:        pointer;
      border:        1px solid transparent;
      transition:    border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-primary {
      background:   var(--accent);
      color:        #000;
      border-color: var(--accent);
      font-weight:  600;
    }

    .btn-primary:hover {
      background:   #a8873a;
      border-color: #a8873a;
    }

    .btn-ghost {
      background:   transparent;
      color:        var(--muted);
      border-color: var(--border);
    }

    .btn-ghost:hover {
      color:        var(--text);
      border-color: #444;
    }

    .btn-test {
      background:   transparent;
      color:        var(--accent);
      border-color: var(--accent);
      font-size:    12px;
      padding:      7px 14px;
    }

    .btn-test:hover {
      background: rgba(201, 168, 76, 0.08);
    }

    .btn-test:disabled {
      opacity: 0.4;
      cursor:  not-allowed;
    }

    /* ── Save feedback ── */
    .save-bar {
      display:         flex;
      align-items:     center;
      justify-content: space-between;
      margin-top:      24px;
      padding-top:     20px;
      border-top:      1px solid var(--border);
    }

    .save-msg {
      font-family:   'DM Mono', monospace;
      font-size:     11px;
      color:         var(--success);
      opacity:       0;
      transition:    opacity 0.3s;
      padding:       4px 8px;
      border-radius: var(--radius);
      border:        1px solid rgba(39, 174, 96, 0.2);
      background:    rgba(39, 174, 96, 0.06);
    }

    .save-msg.visible { opacity: 1; }

    .error-msg {
      font-family:   'DM Mono', monospace;
      font-size:     11px;
      color:         var(--danger);
      opacity:       0;
      transition:    opacity 0.3s;
    }

    .error-msg.visible { opacity: 1; }

    /* ── Footer brand ── */
    .brand-footer {
      margin-top:     40px;
      text-align:     center;
      font-family:    'DM Mono', monospace;
      font-size:      10px;
      color:          #2a2a2a;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="page">

    <header>
      <div>
        <div class="logo-mark">Code Collector</div>
        <div class="header-sub">Extension options — Rear View Foresight LLC</div>
      </div>
    </header>

    <!-- ── Server connection ── -->
    <div class="section">
      <div class="section-label">Server Connection</div>

      <div class="field">
        <label class="field-label" for="serverPort">Local server port</label>
        <div class="field-sub">Must match the port in the tray app settings. Default: 8765.</div>
        <div class="field-row">
          <input type="number" id="serverPort" min="1024" max="65535" value="8765" />
          <button class="btn btn-test" id="testBtn">Test connection</button>
          <span class="status-pill" id="statusPill">—</span>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="authToken">Auth token</label>
        <div class="field-sub">
          Must match the token set in the tray app settings.
          Leave blank to disable auth entirely.
        </div>
        <input type="password" id="authToken" placeholder="no token set" autocomplete="off" />
      </div>
    </div>

    <!-- ── Save ── -->
    <div class="save-bar">
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="save-msg" id="saveMsg">Settings saved.</span>
        <span class="error-msg" id="errorMsg">Invalid port number.</span>
      </div>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>

    <div class="brand-footer">Feic Mo Chroí™ · We make movies.</div>

  </div>

  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    function validatePort(raw) {
      const n = parseInt(raw, 10);
      if (!Number.isFinite(n) || n < 1024 || n > 65535) return null;
      return n;
    }

    async function load() {
      const settings = await new Promise((resolve) =>
        chrome.storage.local.get({ serverPort: 8765, authToken: "" }, resolve)
      );
      $("serverPort").value = settings.serverPort;
      $("authToken").value  = settings.authToken || "";
    }

    async function save() {
      const port = validatePort($("serverPort").value);
      if (!port) {
        showMsg("errorMsg");
        return;
      }

      await new Promise((resolve) =>
        chrome.storage.local.set({ serverPort: port, authToken: $("authToken").value.trim() }, resolve)
      );

      showMsg("saveMsg");
    }

    async function testConnection() {
      const port = validatePort($("serverPort").value);
      if (!port) { showMsg("errorMsg"); return; }

      const pill = $("statusPill");
      const btn  = $("testBtn");

      pill.className    = "status-pill";
      pill.textContent  = "testing…";
      btn.disabled      = true;

      try {
        const res = await fetch(`http://127.0.0.1:${port}/collect`, {
          method: "OPTIONS",
          signal: AbortSignal.timeout(3000),
        });

        if (res.status < 500) {
          pill.className   = "status-pill running";
          pill.textContent = `running on :${port}`;
        } else {
          pill.className   = "status-pill stopped";
          pill.textContent = `error ${res.status}`;
        }
      } catch {
        pill.className   = "status-pill stopped";
        pill.textContent = "not reachable";
      }

      btn.disabled = false;
    }

    function showMsg(id) {
      const el = $(id);
      el.classList.add("visible");
      setTimeout(() => el.classList.remove("visible"), 2500);
    }

    $("saveBtn").addEventListener("click", save);
    $("testBtn").addEventListener("click", testConnection);

    // Save on Enter from either input
    [$("serverPort"), $("authToken")].forEach((el) =>
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") save(); })
    );

    load();
  </script>
</body>
</html>
